<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #faf8ef;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Arial', 'Microsoft YaHei', sans-serif;
      margin: 0;
      padding: 16px;
    }
    .game-container {
      width: 100%;
      max-width: 500px;
      background: #bbada0;
      border-radius: 24px;
      padding: 24px 24px 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      transition: all 0.2s;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      color: #776e65;
    }
    .title {
      font-size: 48px;
      font-weight: 900;
      line-height: 1;
      color: #776e65;
      letter-spacing: -2px;
    }
    .score-box {
      background: #cdc1b4;
      padding: 6px 18px;
      border-radius: 40px;
      color: #f9f6f2;
      font-weight: 700;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
    }
    .score-box span {
      background: #776e65;
      padding: 0 12px;
      border-radius: 30px;
      line-height: 30px;
      color: #f9f6f2;
      font-size: 22px;
      min-width: 50px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      background: #bbada0;
      border-radius: 18px;
      padding: 12px;
      aspect-ratio: 1 / 1;
      margin-bottom: 20px;
      touch-action: none;  /* 防止触摸滚动 */
    }
    .cell {
      background: rgba(238, 228, 218, 0.35);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      font-weight: 800;
      color: #776e65;
      transition: background 0.12s, transform 0.10s;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
      aspect-ratio: 1 / 1;
      will-change: transform;
    }
    /* 数字颜色 (经典2048风格) */
    .cell[data-value="2"] { background: #eee4da; }
    .cell[data-value="4"] { background: #ede0c8; }
    .cell[data-value="8"] { background: #f2b179; color: #f9f6f2; }
    .cell[data-value="16"] { background: #f59563; color: #f9f6f2; }
    .cell[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
    .cell[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
    .cell[data-value="128"] { background: #edcf72; color: #f9f6f2; font-size: 30px; }
    .cell[data-value="256"] { background: #edcc61; color: #f9f6f2; font-size: 30px; }
    .cell[data-value="512"] { background: #edc850; color: #f9f6f2; font-size: 30px; }
    .cell[data-value="1024"] { background: #edc53f; color: #f9f6f2; font-size: 24px; }
    .cell[data-value="2048"] { background: #edc22e; color: #f9f6f2; font-size: 24px; box-shadow: 0 0 20px 4px #ffd966; }
    .cell[data-value="4096"] { background: #60d992; color: #f9f6f2; font-size: 22px; }
    .cell[data-value="8192"] { background: #3c9a6e; color: #f9f6f2; font-size: 22px; }
    .empty-cell {
      background: rgba(238, 228, 218, 0.35);
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    button {
      background: #8f7a66;
      border: none;
      border-radius: 40px;
      color: #f9f6f2;
      font-weight: 700;
      font-size: 18px;
      padding: 12px 32px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 4px 0 #5f4d3e;
      letter-spacing: 0.6px;
      flex: 1 1 auto;
      min-width: 100px;
    }
    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5f4d3e;
    }
    button:hover {
      background: #9f8b76;
    }
    .status-message {
      text-align: center;
      margin-top: 18px;
      font-size: 20px;
      font-weight: 600;
      color: #776e65;
      min-height: 2.4em;
    }
    @media (max-width: 480px) {
      .game-container { padding: 16px 16px 24px; }
      .title { font-size: 36px; }
      .grid { gap: 8px; padding: 8px; }
      .cell { font-size: 28px; }
      .cell[data-value="128"], .cell[data-value="256"], .cell[data-value="512"] { font-size: 22px; }
      .cell[data-value="1024"], .cell[data-value="2048"] { font-size: 18px; }
      .cell[data-value="4096"], .cell[data-value="8192"] { font-size: 16px; }
    }
  </style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <div class="title">2048</div>
    <div class="score-box">🏆 <span id="scoreDisplay">0</span></div>
  </div>

  <!-- 4x4 网格 -->
  <div class="grid" id="gridContainer"></div>

  <div class="controls">
    <button id="newGameBtn">🔄 新游戏</button>
    <button id="undoBtn">↩️ 撤回</button>
  </div>
  <div id="statusMessage" class="status-message"></div>
</div>

<script>
  (function() {
    // ---------- 核心配置 ----------
    const SIZE = 4;
    let grid = [];                // 二维数组，存储每个格子的值 (0 表示空)
    let score = 0;
    let gameOver = false;
    let winFlag = false;          // 是否已出现2048 (不阻止继续游戏)
    let history = [];            // 用于撤回: 存储 { grid, score }

    // DOM 元素
    const gridEl = document.getElementById('gridContainer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const statusMsg = document.getElementById('statusMessage');

    // ---------- 辅助函数 ----------
    function getEmptyCells() {
      const cells = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 0) cells.push({ row: r, col: c });
        }
      }
      return cells;
    }

    // 随机选择一个空格子生成 2 或 4 (90% 2, 10% 4)
    function spawnTile() {
      const empty = getEmptyCells();
      if (empty.length === 0) return false;
      const { row, col } = empty[Math.floor(Math.random() * empty.length)];
      grid[row][col] = Math.random() < 0.9 ? 2 : 4;
      return true;
    }

    // 深拷贝 grid
    function cloneGrid(g) {
      return g.map(row => [...row]);
    }

    // 保存当前状态到历史 (用于撤回)
    function pushHistory() {
      history.push({
        grid: cloneGrid(grid),
        score: score
      });
      // 限制历史长度，避免内存过大 (最多30步)
      if (history.length > 30) history.shift();
    }

    // ---------- 核心移动逻辑 (合并与滑动) ----------
    // 对一维数组进行滑动合并 (左->右方向)
    function slideRow(row) {
      // 1. 移除零 (压缩)
      let filtered = row.filter(val => val !== 0);
      // 2. 相邻合并
      let merged = [];
      let i = 0;
      while (i < filtered.length) {
        if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
          const val = filtered[i] * 2;
          merged.push(val);
          score += val;           // 增加分数
          i += 2;
        } else {
          merged.push(filtered[i]);
          i++;
        }
      }
      // 3. 补零至 SIZE 长度
      while (merged.length < SIZE) {
        merged.push(0);
      }
      return merged;
    }

    // 移动方向: 0:左, 1:右, 2:上, 3:下
    function move(direction) {
      if (gameOver) {
        statusMsg.innerText = '😵 游戏已结束，点击"新游戏"重新开始';
        return false;
      }

      // 保存历史 (用于撤回)
      pushHistory();

      const oldGrid = cloneGrid(grid);
      let moved = false;

      // 根据方向处理
      if (direction === 0) { // 左
        for (let r = 0; r < SIZE; r++) {
          const newRow = slideRow(grid[r]);
          if (!moved && !arraysEqual(grid[r], newRow)) moved = true;
          grid[r] = newRow;
        }
      } else if (direction === 1) { // 右
        for (let r = 0; r < SIZE; r++) {
          const reversed = [...grid[r]].reverse();
          const newRow = slideRow(reversed);
          const finalRow = newRow.reverse();
          if (!moved && !arraysEqual(grid[r], finalRow)) moved = true;
          grid[r] = finalRow;
        }
      } else if (direction === 2) { // 上
        for (let c = 0; c < SIZE; c++) {
          const colVals = [];
          for (let r = 0; r < SIZE; r++) colVals.push(grid[r][c]);
          const newCol = slideRow(colVals);
          for (let r = 0; r < SIZE; r++) {
            if (grid[r][c] !== newCol[r]) moved = true;
            grid[r][c] = newCol[r];
          }
        }
      } else if (direction === 3) { // 下
        for (let c = 0; c < SIZE; c++) {
          const colVals = [];
          for (let r = SIZE - 1; r >= 0; r--) colVals.push(grid[r][c]);
          const newCol = slideRow(colVals);
          const finalCol = newCol.reverse(); // 还原顺序
          for (let r = 0; r < SIZE; r++) {
            if (grid[r][c] !== finalCol[r]) moved = true;
            grid[r][c] = finalCol[r];
          }
        }
      }

      // 如果发生了移动，生成新方块并检查游戏状态
      if (moved) {
        spawnTile();
        updateUI();

        // 检查胜利 (出现2048)
        if (!winFlag) {
          for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
              if (grid[r][c] === 2048) {
                winFlag = true;
                statusMsg.innerText = '🎉 你赢了！ 继续挑战更高分吧！';
                break;
              }
            }
            if (winFlag) break;
          }
        }

        // 检查游戏是否结束 (无空格且无法合并)
        if (isGameOver()) {
          gameOver = true;
          statusMsg.innerText = '💔 游戏结束！点击"新游戏"再来一局';
        } else {
          if (!winFlag) statusMsg.innerText = '▶️ 继续滑动~';
        }
        updateScore();
        return true;
      } else {
        // 未发生移动，弹出历史 (撤回无效操作)
        history.pop();
        statusMsg.innerText = '⛔ 无法移动，换方向试试';
        return false;
      }
    }

    // 判断两个数组是否相等 (用于检测移动)
    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    // 检查游戏是否结束 (无空格且没有相邻相同)
    function isGameOver() {
      // 有空位 => 未结束
      if (getEmptyCells().length > 0) return false;

      // 检查水平相邻
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE - 1; c++) {
          if (grid[r][c] === grid[r][c + 1]) return false;
        }
      }
      // 检查垂直相邻
      for (let r = 0; r < SIZE - 1; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === grid[r + 1][c]) return false;
        }
      }
      return true;
    }

    // ---------- UI 渲染 ----------
    function renderGrid() {
      gridEl.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const val = grid[r][c];
          if (val !== 0) {
            cell.textContent = val;
            cell.setAttribute('data-value', val);
          } else {
            cell.classList.add('empty-cell');
            cell.textContent = '';
          }
          gridEl.appendChild(cell);
        }
      }
    }

    function updateScore() {
      scoreDisplay.textContent = score;
    }

    function updateUI() {
      renderGrid();
      updateScore();
    }

    // ---------- 新游戏初始化 ----------
    function initGame() {
      grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      score = 0;
      gameOver = false;
      winFlag = false;
      history = [];
      // 初始生成两个方块
      spawnTile();
      spawnTile();
      updateUI();
      statusMsg.innerText = '✨ 滑动合并数字，向2048进发！';
    }

    // ---------- 撤回功能 ----------
    function undoMove() {
      if (history.length === 0) {
        statusMsg.innerText = '⏳ 没有可以撤回的步骤';
        return;
      }
      if (gameOver) {
        // 如果游戏结束，撤回可以复活，重置结束标记
        gameOver = false;
        winFlag = false;   // 重新检测胜利
      }
      const prev = history.pop();
      grid = prev.grid;
      score = prev.score;
      // 检查是否胜利 (防止撤回后丢失胜利状态)
      winFlag = false;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 2048) winFlag = true;
        }
      }
      // 检查是否游戏结束
      if (isGameOver() && getEmptyCells().length === 0) {
        gameOver = true;
        statusMsg.innerText = '💔 撤回后仍处于结束状态';
      } else {
        gameOver = false;
        statusMsg.innerText = '↩️ 已撤回一步';
      }
      updateUI();
      // 如果游戏结束且没有空位，显示结束信息
      if (gameOver) statusMsg.innerText = '💔 游戏结束！点击"新游戏"再来一局';
    }

    // ---------- 键盘控制 ----------
    function onKeyDown(e) {
      const key = e.key;
      let dir = -1;
      if (key === 'ArrowLeft') dir = 0;
      else if (key === 'ArrowRight') dir = 1;
      else if (key === 'ArrowUp') dir = 2;
      else if (key === 'ArrowDown') dir = 3;
      else return;

      e.preventDefault(); // 防止滚动
      if (dir !== -1) {
        move(dir);
      }
    }

    // ---------- 触摸支持 (简单滑动) ----------
    let touchStartX = 0, touchStartY = 0;
    function onTouchStart(e) {
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }
    function onTouchEnd(e) {
      if (touchStartX === 0 && touchStartY === 0) return;
      const touchEnd = e.changedTouches[0];
      const dx = touchEnd.clientX - touchStartX;
      const dy = touchEnd.clientY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);
      if (Math.max(absDx, absDy) < 20) return; // 太短忽略

      let dir = -1;
      if (absDx > absDy) {
        dir = dx > 0 ? 1 : 0; // 右:1 左:0
      } else {
        dir = dy > 0 ? 3 : 2; // 下:3 上:2
      }
      if (dir !== -1) {
        move(dir);
      }
      touchStartX = 0;
      touchStartY = 0;
    }

    // ---------- 挂载事件 & 启动 ----------
    window.addEventListener('keydown', onKeyDown);

    // 触摸事件
    gridEl.addEventListener('touchstart', onTouchStart, { passive: true });
    gridEl.addEventListener('touchend', onTouchEnd, { passive: false });

    // 按钮
    document.getElementById('newGameBtn').addEventListener('click', () => {
      initGame();
    });
    document.getElementById('undoBtn').addEventListener('click', undoMove);

    // 开始!
    initGame();

    // 阻止页面上下滑动 (针对触摸)
    document.addEventListener('touchmove', (e) => {
      if (e.target.closest('.game-container')) e.preventDefault();
    }, { passive: false });

  })();
</script>
</body>
</html>
